[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "radica"
version = "0.1.0"
description = "Asistente de gestión de PQRS con plazos legales (MVP del diplomado, Módulo 3)."
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Jose Miguel Chávez Figueroa" },
    { name = "Isabella Castaño Muñoz" },
]
dependencies = [
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "cryptography==50.0.2",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
    "anthropic==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
]

[project.scripts]
radica-trabajador = "radica.main:ejecutar_trabajador"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"radica.adaptadores.salida.palabras_clave" = ["diccionario.json"]
"radica.adaptadores.salida.ia" = ["instrucciones/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
