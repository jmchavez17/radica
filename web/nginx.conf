# Sirve la interfaz y lleva /api/ y /health al servicio api.
# El navegador ve un solo origen (127.0.0.1:8080 en local), así que la API no necesita CORS.
#
# Es una plantilla: al arrancar, la imagen de nginx reemplaza las variables RADICA_RESOLVER
# y RADICA_API_URL con las del entorno (web/Dockerfile). Los valores por defecto son los de
# Compose; en Railway se definen en el servicio web (README, «Despliegue»).
server_tokens off;

# Las respuestas de la API no se guardan en la caché del navegador. index.html se revalida
# siempre, para que una versión nueva llegue sin recargar a la fuerza; los archivos de
# /assets/ llevan un hash en el nombre y pueden quedarse.
map $uri $cache_control {
    ~^/api/     "no-store";
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS de la red interna: vuelve a resolver la API para no quedarse con una IP vieja si
    # se recrea. Por defecto, el DNS de Docker (127.0.0.11 ipv6=off) y «api:8000».
    resolver ${RADICA_RESOLVER} valid=10s;
    set $api ${RADICA_API_URL};

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Con una variable y sin URI, proxy_pass reenvía la ruta y la consulta tal como llegan.
    location /api/ {
        proxy_pass $api;
    }

    location = /health {
        proxy_pass $api;
    }
}
